---
# Kernel parameters required for Oracle 19c on Oracle Linux 7/8
- name: Configure kernel parameters for Oracle
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/98-oracle.conf
  loop:
    - { name: "fs.file-max",              value: "6815744" }
    - { name: "kernel.sem",               value: "250 32000 100 128" }
    - { name: "kernel.shmmni",            value: "4096" }
    - { name: "kernel.shmall",            value: "1073741824" }
    - { name: "kernel.shmmax",            value: "4398046511104" }
    - { name: "kernel.panic_on_oops",     value: "1" }
    - { name: "net.core.rmem_default",    value: "262144" }
    - { name: "net.core.rmem_max",        value: "4194304" }
    - { name: "net.core.wmem_default",    value: "262144" }
    - { name: "net.core.wmem_max",        value: "1048576" }
    - { name: "net.ipv4.conf.all.rp_filter", value: "2" }
    - { name: "net.ipv4.conf.default.rp_filter", value: "2" }
    - { name: "fs.aio-max-nr",            value: "1048576" }
    - { name: "net.ipv4.ip_local_port_range", value: "9000 65500" }

- name: Configure Oracle user resource limits
  blockinfile:
    path: /etc/security/limits.d/oracle-database-server-19c-preinstall.conf
    create: true
    block: |
      oracle   soft   nofile    1024
      oracle   hard   nofile    65536
      oracle   soft   nproc     16384
      oracle   hard   nproc     16384
      oracle   soft   stack     10240
      oracle   hard   stack     32768
      oracle   hard   memlock   134217728
      oracle   soft   memlock   134217728
      grid     soft   nofile    1024
      grid     hard   nofile    65536
      grid     soft   nproc     16384
      grid     hard   nproc     16384
      grid     soft   stack     10240
      grid     hard   stack     32768
      grid     hard   memlock   134217728
      grid     soft   memlock   134217728

- name: Disable transparent hugepages (boot time)
  lineinfile:
    path: /etc/rc.d/rc.local
    line: "{{ item }}"
    create: true
    mode: "0755"
  loop:
    - "echo never > /sys/kernel/mm/transparent_hugepage/enabled"
    - "echo never > /sys/kernel/mm/transparent_hugepage/defrag"

- name: Disable transparent hugepages (runtime)
  shell: |
    echo never > /sys/kernel/mm/transparent_hugepage/enabled
    echo never > /sys/kernel/mm/transparent_hugepage/defrag
  changed_when: false
