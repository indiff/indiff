---
# Build /etc/hosts with all nodes in the current deployment.
# The template is rendered with the complete inventory so every node sees
# its peers' public, VIP, and private addresses.

- name: Configure /etc/hosts from template
  template:
    src:   hosts.j2
    dest:  /etc/hosts
    owner: root
    group: root
    mode:  "0644"

- name: Disable DNS lookup in /etc/resolv.conf (use hosts only for RAC names)
  lineinfile:
    path:   /etc/resolv.conf
    regexp: '^search'
    line:   "search {{ domain_name }}"
    create: true
