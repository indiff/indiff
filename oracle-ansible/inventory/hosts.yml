---
# Oracle RAC/ADG Ansible Inventory Template
# Copy this file and edit for your environment.
#
# Architecture types (set arch_type in group_vars/all.yml):
#   rac              - RAC cluster only
#   adg              - Standalone primary + standby (ADG)
#   rac_adg          - RAC primary cluster + RAC standby cluster
#   rac_standalone_adg - RAC primary cluster + standalone standby (ADG)
#
# Group conventions:
#   rac_primary      - Nodes forming the primary RAC cluster
#   rac_standby      - Nodes forming the standby RAC cluster (rac_adg only)
#   adg_primary      - Single primary node (adg / rac_standalone_adg: first rac node acts as primary)
#   adg_standby      - Single standby node

all:
  children:

    # ── RAC primary cluster nodes ──────────────────────────────────────────
    rac_primary:
      hosts:
        rac1-node1:
          ansible_host: 192.168.56.111
          node_index: 1
          public_ip:  192.168.56.111
          vip_ip:     192.168.56.112
          private_ip: 192.168.200.111
        rac1-node2:
          ansible_host: 192.168.56.121
          node_index: 2
          public_ip:  192.168.56.121
          vip_ip:     192.168.56.122
          private_ip: 192.168.200.122

    # ── RAC standby cluster nodes (only used for arch_type: rac_adg) ──────
    rac_standby:
      hosts:
        rac2-node1:
          ansible_host: 192.168.57.111
          node_index: 1
          public_ip:  192.168.57.111
          vip_ip:     192.168.57.112
          private_ip: 192.168.201.111
        rac2-node2:
          ansible_host: 192.168.57.121
          node_index: 2
          public_ip:  192.168.57.121
          vip_ip:     192.168.57.122
          private_ip: 192.168.201.122

    # ── Standalone ADG primary (arch_type: adg only) ──────────────────────
    adg_primary:
      hosts:
        ora-primary:
          ansible_host: 192.168.56.200
          public_ip:  192.168.56.200
          private_ip: 192.168.200.200

    # ── ADG standby node (adg / rac_standalone_adg) ───────────────────────
    adg_standby:
      hosts:
        ora-standby:
          ansible_host: 192.168.56.210
          public_ip:  192.168.56.210
          private_ip: 192.168.200.210
